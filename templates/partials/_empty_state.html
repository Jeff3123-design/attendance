<div class="card empty-state-card shadow-sm my-3">
  <div class="card-body">
    <div class="empty-state-icon">
      <i class="bi {{ icon|default:'bi-hourglass-split' }}"></i>
    </div>
    <h4 class="h5 fw-bold text-dark mb-2">{{ title|default:"Content coming soon" }}</h4>
    <p class="text-muted mx-auto mb-4" style="max-width: 520px;">
      {{ description|default:"This module scaffold has been configured and routed. Production data feeds and biometric logic will be integrated in the upcoming phase." }}
    </p>
    {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-outline-primary btn-sm px-3">
      {{ action_label|default:"Return to Dashboard" }}
    </a>
    {% endif %}
  </div>
</div>
