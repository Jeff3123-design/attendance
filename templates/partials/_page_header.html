<div class="d-flex flex-wrap align-items-center justify-content-between mb-4 pb-2 border-bottom">
  <div>
    <h2 class="h4 fw-bold text-dark mb-1">{{ title }}</h2>
    {% if description %}
      <p class="text-muted small mb-0">{{ description }}</p>
    {% endif %}
  </div>
  {% if action_url %}
  <div class="mt-2 mt-md-0">
    <a href="{{ action_url }}" class="btn btn-primary btn-sm px-3 shadow-sm">
      {% if action_icon %}<i class="bi {{ action_icon }} me-1"></i>{% endif %}
      {{ action_label|default:"New Action" }}
    </a>
  </div>
  {% endif %}
</div>
