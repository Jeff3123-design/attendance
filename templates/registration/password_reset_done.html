{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5 text-center py-5">
    <div class="card shadow-sm border-0 rounded-4 p-4">
      <div class="card-body">
        <i class="bi bi-envelope-check text-info fs-1 mb-3"></i>
        <h4 class="fw-bold mb-2">Password Reset Sent</h4>
        <p class="text-muted small mb-4">We've emailed you instructions for resetting your password if an account exists with that email address.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary px-4">Back to Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
