{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    {% include "partials/_page_header.html" with title="Reset Password" description="Enter your email to receive recovery instructions." %}

    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label small fw-semibold">Email address</label>
            <input type="email" name="email" class="form-control" required id="id_email" placeholder="e.g. admin@school.ac.ke">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link</button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'accounts:login' %}" class="small text-decoration-none">Back to Sign In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
